<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CourtIQ Ice | AI 對弈測試</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1e3449;background:#f1f5f8}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:820px;margin:auto}.panel{background:white;border:1px solid #d8e2e8;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:22px;margin:5px 0}p{line-height:1.5}small{color:#607487}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:11px 15px;background:#fff;border:1px solid #b7cbd8;border-radius:10px;color:#183750;font-weight:650;cursor:pointer}button.active,button.primary{background:#226594;color:white;border-color:#226594}button:disabled{opacity:.4}svg{width:100%;touch-action:manipulation;display:block}#rink{border-radius:14px;background:#eaf5fb;cursor:crosshair}#notice{min-height:44px;background:#f5f8fa;padding:10px;border-radius:8px}#stats{font-variant-numeric:tabular-nums} .player{cursor:pointer}.player text{pointer-events:none}#mode button{flex:1} .steps{color:#456} @media(max-width:500px){body{padding:8px}.panel{padding:11px}button{padding:10px}} </style></head><body><main><h1>🏒 CourtIQ Ice｜AI 對弈測試</h1><p>第 10 堂：球門後方防守。點選藍隊球員，再點冰場安排移動；按「執行回合」觀察 AI 的回應。</p><div class="panel"><div class="row" id="mode"><button id="individual" class="active">個人模式：中鋒 C</button><button id="team">整隊模式：5 人</button></div><p><small>藍隊是你／紅隊 AI，個人模式下其他藍隊員也由 AI 控制。單回合最多移動 70 單位。</small></p><svg id="rink" viewBox="0 0 1000 600" role="img" aria-label="可點擊的冰球戰術板"><rect x="42" y="52" width="916" height="496" rx="90" fill="#e7f4fa" stroke="#578ba4" stroke-width="5"/><path d="M365 52 V548 M635 52 V548" stroke="#4e91bd" stroke-width="6"/><path d="M500 52V548" stroke="#d46c6f" stroke-width="4"/><circle cx="500" cy="300" r="65" fill="none" stroke="#cc6b70" stroke-width="4"/><rect x="55" y="265" width="40" height="70" rx="5" fill="none" stroke="#d56d6e" stroke-width="5"/><rect x="905" y="265" width="40" height="70" rx="5" fill="none" stroke="#d56d6e" stroke-width="5"/><g id="players"></g><circle id="puck" r="9" fill="#1d252e" stroke="white" stroke-width="3"/><circle id="target" r="12" fill="none" stroke="#1c996d" stroke-width="4" visibility="hidden"/></svg><p id="stats"></p><div class="row"><span>選擇：<b id="selected">C</b></span><button class="primary" id="go">執行回合</button><button id="undo">悔棋</button><button id="redo">重做</button><button id="reset">重設</button></div><p id="notice">已載入第 10 課示意局面。選擇球員並安排下一個落點。</p></div><div class="panel"><b>測試版限制</b><p><small>使用專案中的真實 duel-core 與 baseline AI 模組。尚未包含射門、碰撞、完整冰球規則或 AI 深度搜尋。預覽不更改正式課程。</small></p></div></main><script type="module">
import {createDuel,stepDuel,createDuelHistory} from './duel/duel-core.js';import {planBaselineAI} from './duel/duel-ai.js';
const $=id=>document.getElementById(id),initial={own:{C:{x:250,y:300},LW:{x:400,y:150},RW:{x:400,y:450},LD:{x:160,y:220},RD:{x:160,y:390}},opponents:{OC:{x:100,y:370},OL:{x:220,y:290},OR:{x:350,y:400},ODL:{x:500,y:150},ODR:{x:500,y:450}},puck:{x:100,y:370},owner:'OC',lessonId:'center-net-front',caseId:'front-covered'};
let mode='individual',history,selection='C',planned={};const ns='http://www.w3.org/2000/svg';function start(){history=createDuelHistory(createDuel(initial,{mode}));planned={};selection='C';render();$('notice').textContent='選擇球員並點擊冰場。';}
function render(){const s=history.current(),g=$('players');g.replaceChildren();for(const [side,team,color] of [['own',s.own,'#317ca9'],['opponents',s.opponents,'#d46c5c']])for(const [id,p] of Object.entries(team)){const q=planned[id]||p,elt=document.createElementNS(ns,'g');elt.setAttribute('class','player');elt.setAttribute('transform',`translate(${q.x} ${q.y})`);let c=document.createElementNS(ns,'circle');c.setAttribute('r',id===selection?22:18);c.setAttribute('fill',color);c.setAttribute('stroke',id===selection?'#e8b345':'white');c.setAttribute('stroke-width',id===selection?'5':'3');let t=document.createElementNS(ns,'text');t.textContent=id;t.setAttribute('text-anchor','middle');t.setAttribute('dy','5');t.setAttribute('fill','white');t.setAttribute('font-size','14');t.setAttribute('font-weight','700');elt.append(c,t);elt.addEventListener('click',e=>{e.stopPropagation();if(s.controlledPlayers.includes(id)){selection=id;render();}});g.append(elt);}
 const carrier=s.owner, pos=planned[carrier]||(carrier?s[Object.hasOwn(s.own,carrier)?'own':'opponents'][carrier]:s.puck);$('puck').setAttribute('cx',pos.x);$('puck').setAttribute('cy',pos.y);$('selected').textContent=selection;$('stats').textContent=`回合 ${s.tick}｜持球者 ${s.owner||'無'}｜模式 ${mode==='team'?'整隊':'個人'}`;$('undo').disabled=s.tick===0;$('target').setAttribute('visibility',planned[selection]?'visible':'hidden');if(planned[selection]){$('target').setAttribute('cx',planned[selection].x);$('target').setAttribute('cy',planned[selection].y);}}
$('rink').addEventListener('click',e=>{const s=history.current(),rect=$('rink').getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*1000,y=(e.clientY-rect.top)/rect.height*600,p=s.own[selection];if(!p)return;const d=Math.hypot(x-p.x,y-p.y);if(d>70){$('notice').textContent='移動太遠，單回合限制為 70 單位。';return;}planned[selection]={x,y};$('notice').textContent=`已安排 ${selection} 移動，尚未提交。`;render();});
$('go').onclick=()=>{try{const s=history.current(),player=Object.entries(planned).map(([role,to])=>({type:'move',role,to})),ai=planBaselineAI(s);const next=stepDuel(s,player,ai);history.commit(next);planned={};$('notice').textContent=`第 ${next.tick} 回合完成，AI 執行 ${ai.length} 名球員的基礎走位。`;render();}catch(e){$('notice').textContent=e.message;}};
$('undo').onclick=()=>{history.undo();planned={};render();$('notice').textContent='已回上一回合';};$('redo').onclick=()=>{history.redo();planned={};render();$('notice').textContent='已重做';};$('reset').onclick=start;
for(const m of ['individual','team'])$(m).onclick=()=>{mode=m;for(const b of ['individual','team'])$(b).classList.toggle('active',b===m);start();};start();
</script></body></html>
