<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CourtIQ｜教材製作室</title><link rel="stylesheet" href="author.css"><header><a href="./">← 回學習室</a><strong>教材製作室</strong><span>本機草稿 · 尚未發布</span></header><main><p class="notice">把 IG 影片交給 ChatGPT 分析製作，再匯入整理好的教材草稿，在這裡檢查與微調。不必從空白重做。本站不會自行辨識影片；參考影片只在本機播放。</p><section class="bar"><label>草稿 <select id="drafts"></select></label><button id="new">從空白新增（選用）</button><button id="save">儲存新版本</button><button id="export">匯出教材草稿</button><button id="import">匯入整理好的教材</button><input id="json" type="file" accept="application/json,.json" hidden><span id="status" role="status"></span></section><details class="card"><summary>教材資訊與來源（選填／修改）</summary><section class="fields"><label>教材名稱<input id="title" maxlength="80" placeholder="例如：強打爭球後的分工"></label><label>來源網址<input id="source" type="url" placeholder="IG／比賽來源連結（紀錄用）"></label><label>作者／來源備註<input id="credit" maxlength="200"></label><label>分類<input id="category" maxlength="50" placeholder="例如：進攻、防守、強打"></label></section></details><div class="workspace"><section class="review-panel card"><h2>確認教材內容</h2><p>切換情境，先看戰術與解讀；需要更改時再展開微調。</p><div class="bar"><select id="scenarios" aria-label="選擇情境"></select><button id="addCase">＋情境</button></div><canvas id="replayCanvas" width="1000" height="600" aria-label="情境戰術預覽"></canvas><div class="bar"><button id="replayPlay">播放戰術</button><input id="replaySeek" type="range" min="0" max="0" step=".05" value="0" aria-label="戰術播放時間"><span id="replayTime"></span></div><div id="reviewSummary"></div><details class="card"><summary>微調情境文字與觀察時間</summary><label>情境名稱<input id="label" maxlength="80"></label><label>觀察時刻（影片秒數）<input id="moment" type="number" min="0" step=".01"></label><label>學習重點<textarea id="focus" maxlength="2000"></textarea></label><label>問題<textarea id="question" maxlength="2000"></textarea></label><label>示範解讀與理由<textarea id="feedback" maxlength="4000" placeholder="由教練確認；畫面不足時記錄待確認的證據。"></textarea></label></details><label><input type="checkbox" id="reviewed"> 已核對本情境的路線與教學解讀</label><p id="captureInfo">尚未擷取戰術</p><button id="preview">預覽本情境</button><div id="previewText"></div><details class="card"><summary>版本紀錄</summary><div id="versions"></div></details></section><section class="card"><h2>需要修改球員或路線？</h2><p>另外開啟完整戰術板，不在此頁嵌入第二個捲動區。完成後按戰術板上的「帶回教材室」。</p><div class="bar"><button id="restore">編輯本情境戰術</button><button id="capture">開啟戰術板</button></div></section><details class="card"><summary>原影片對照（需要時展開）</summary><input id="videoFile" type="file" accept="video/*"><p id="videoName">尚未選影片。來源網址僅供紀錄。</p><video id="video" controls playsinline preload="metadata"></video><div class="bar"><button id="start">目前時間設為開始</button><button id="end">目前時間設為結束</button><button id="clip">播放片段</button></div><div class="fields"><label>開始（秒）<input id="from" type="number" min="0" step=".01"></label><label>結束（秒）<input id="to" type="number" min="0" step=".01"></label></div><p>影片檔不包含在草稿備份中；重新開啟時請選回原影片。</p></details></div></main><script type="module" src="author.js"></script></html>
