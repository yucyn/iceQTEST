<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CourtIQ Ice｜即時對弈 MVP</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#213c40;background:#f1f5f3}*{box-sizing:border-box}body{margin:0}header{background:#12363c;color:white;padding:16px max(16px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:#d3efdf;text-decoration:none}main{max-width:1160px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(23px,3vw,34px);margin:0 0 8px}p{line-height:1.65}.sub{color:#58716e;margin-top:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}.card{background:white;border:1px solid #d7e3df;border-radius:17px;overflow:hidden}.pad{padding:14px 16px}.board{background:#e9f0ed;position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio: 960/600;touch-action:none}.score{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}.score strong{font-size:22px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,select{font:inherit;border:1px solid #bdccc7;border-radius:10px;background:#fff;color:#26484a;min-height:43px;padding:8px 12px;cursor:pointer}button:hover{background:#e7f2ee}button.primary{background:#246d69;color:white;border-color:#246d69}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #d89965}label{font-size:14px;display:block;margin:8px 0}select{max-width:100%;width:100%}.muted{color:#54706b;font-size:14px}.coach{border-left:4px solid #d17c62;padding:8px 12px;background:#faf4ee;border-radius:7px;min-height:86px}.coach b{display:block;margin-bottom:6px}.controls{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.joystick{position:relative;width:154px;height:154px;border-radius:50%;background:radial-gradient(circle,#edf7f3 0%,#d5e7e1 73%,#c7dcd5 100%);border:2px solid #a4c3b8;touch-action:none;user-select:none;cursor:grab;box-shadow:inset 0 2px 8px #2a5e4a18}.joystick:focus-visible{outline:3px solid #d89965;outline-offset:3px}.joy-knob{position:absolute;width:62px;height:62px;left:44px;top:44px;border-radius:50%;background:#277b76;border:3px solid white;box-shadow:0 4px 10px #183b3850;pointer-events:none}.joy-label{font-size:12px;margin-top:6px;color:#58716e}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{min-width:74px}.foot{font-size:13px;color:#66817b;margin-top:16px}.tag{display:inline-block;background:#e4f1ed;color:#266d66;padding:4px 9px;border-radius:20px;font-size:12px;margin-bottom:8px}@media(max-width:760px){.layout{grid-template-columns:1fr}.actions{flex:1;justify-content:flex-end}.actions button{flex:1}.controls{align-items:flex-start}}
</style></head><body><header><a href="./index.html">← CourtIQ Ice 學習室</a><strong>LIVE SCRIMMAGE · 2D</strong></header>
<main><span class="tag">獨立測試版 · 5 對 5 + 守門員</span><h1>即時對弈</h1><p class="sub">操作球員連續滑行，隊友主動接應，對手跟防補位；傳球、搶球、射門都在同一段時間內發生。</p>
<div class="layout"><section class="card"><div class="pad score"><span>● 青隊 <strong id="home">0</strong></span><span id="clock">00:00</span><span>紅隊 <strong id="away">0</strong> ●</span></div>
<div class="board"><canvas id="rink" width="960" height="600" tabindex="0" aria-label="即時冰球對弈場地；按方向鍵或 WASD 控制，點己方球員切換，點空白位置自動滑行"></canvas></div>
<div class="pad"><div id="status" role="status">開球準備。按開始進行即時對弈。</div><div class="buttons"><button class="primary" id="toggle">開始</button><button id="reset">重新開局</button><button id="switch">切換球員</button><button id="replay">回放</button></div>
<div class="controls"><div><div id="joystick" class="joystick" role="group" tabindex="0" aria-label="方向圓盤。拖曳控制球員滑行。"><div id="joyKnob" class="joy-knob"></div></div></div><div class="actions"><button id="pass" class="primary">傳球</button><button id="shoot">射門</button><button id="steal">搶球</button></div></div>
</div></section>
<aside class="card pad"><h2 style="margin-top:0;font-size:20px">戰術教練</h2><div class="coach" aria-live="polite"><b id="coachTitle">觀察位置</b><span id="coachText">按開始，注意持球者與防守者之間的距離。</span></div>
<label for="receiver">傳球目標</label><select id="receiver" aria-label="選擇傳球目標"></select>
<label for="difficulty">AI 防守強度</label><select id="difficulty"><option value="0.65">初階 · 慢速跟防</option><option value="1" selected>標準 · 協防補位</option><option value="1.35">進階 · 積極壓迫</option></select>
<label for="speed">模擬速度</label><select id="speed"><option value="0.7">0.7 倍</option><option value="1" selected>1 倍</option><option value="1.3">1.3 倍</option></select>

<h3 style="font-size:16px">即時狀態</h3><p id="details" class="muted" aria-live="polite">球權：青隊 C</p>
</aside></div></main>
<script type="module" src="./live-mode.js"></script></body></html>
