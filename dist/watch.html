<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CourtIQ｜觀看演練</title><style>body{margin:20px;background:#f7f8f1;color:#183b3e;font:16px system-ui}iframe{border:0;width:100%;height:85vh}p{line-height:1.8}</style><p id="status" role="status">正在讀取分享的演練…</p><iframe id="player" title="演練播放器" sandbox="allow-scripts" hidden></iframe><script type="module">import {decodeShare,portableHTML} from './replay-sharing.js';import {prepareReplay} from './replay-store.js';try{const raw=await decodeShare(location.hash.slice(1)),record=prepareReplay(raw).record;document.getElementById('player').srcdoc=portableHTML(record);document.getElementById('player').hidden=false;document.getElementById('status').textContent='分享的教學演練 · 僅供觀看，未寫入你的紀錄';}catch(e){document.getElementById('status').textContent='無法開啟演練：'+e.message+'。請向分享者索取 HTML 回放檔。';}</script></html>
